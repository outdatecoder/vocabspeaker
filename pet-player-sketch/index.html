<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>外语词汇听读播放器 · 界面草图</title>
<style>
  /* 词汇讲义：与工作台 home.html 同一套令牌（纸 · 墨 · 荧光笔 · 印章）。
     离线单文件，字体只用系统自带的楷体/衬线/等宽，不引任何外部资源。 */
  :root{
    --paper:#F6F2E7; --paper-2:#FFFCF3; --card:#FFFDF6;
    --ink:#1D1A16; --mid:#4A443A; --muted:#8A8172;
    --line:#DED5C0; --line-2:#CBBFA3;
    --brand:#1D1A16;                       /* 历史上 --brand 当"填充色"用，这里仍指墨 */
    --brand-soft:rgba(247,222,88,.34);     /* 选中/当前 = 荧光笔浅黄，不再是靛蓝 */
    --marker:#F7DE58; --seal:#B23A2F; --moss:#4E6B3E;
    --prussian:#2C4A5E; --ochre:#8A6A2F;
    --live:#4E6B3E; --warn:#8A6A2F; --bad:#B23A2F;
    --shadow:0 1px 0 rgba(29,26,22,.05),0 10px 26px -14px rgba(29,26,22,.35);
    --shadow-lg:0 2px 0 rgba(29,26,22,.06),0 22px 44px -20px rgba(29,26,22,.45);
    --kai:"KaiTi","STKaiti","Kaiti SC","Palatino Linotype",Palatino,Georgia,serif;
    --sans:"Microsoft YaHei","PingFang SC","Hiragino Sans GB",sans-serif;
    --mono:ui-monospace,Consolas,"Courier New",monospace;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    /* 纸：极淡 32px 横格线。用 background 而非覆盖层伪元素（否则线会画到字上） */
    background-color:var(--paper);
    background-image:repeating-linear-gradient(to bottom,
      transparent 0 31px, rgba(29,26,22,.045) 31px 32px);
    color:var(--ink);
    font-family:var(--sans);
    font-size:16px;line-height:1.55;overflow-x:hidden;
  }
  .wrap{max-width:820px;margin:0 auto;padding:0 16px 32px}

  /* ---------- 顶栏 ---------- */
  .topbar{
    position:sticky;top:0;z-index:20;background:rgba(246,242,231,.88);
    backdrop-filter:blur(10px);border-bottom:1px solid var(--line);
  }
  .topbar-in{max-width:820px;margin:0 auto;padding:12px 16px;display:flex;
    align-items:center;gap:12px;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;
    font-family:var(--kai);letter-spacing:.01em}
  .brand .logo{width:30px;height:30px;border-radius:6px;background:var(--ink);
    display:grid;place-items:center;color:var(--paper-2);font-size:15px;flex:0 0 auto;
    box-shadow:0 2px 0 rgba(29,26,22,.25)}
  /* 版本号推到最右 —— 与工作台 .top-right 同一处置（左对齐时它会紧贴「＋ 添加词表」的硬投影） */
  .tagline{margin-left:auto;color:var(--muted);font-size:12.5px;font-family:var(--mono)}
  /* 「＋ 添加词表」只在通过本地服务访问时出现（file:// 下 fetch 失败即隐藏） */
  .gen-link{display:none;align-items:center;gap:6px;min-height:38px;padding:0 13px;
    border-radius:8px;background:var(--ink);color:var(--paper-2);
    text-decoration:none;font-size:13.5px;font-weight:700;
    box-shadow:0 3px 0 rgba(29,26,22,.22);transition:transform .12s,box-shadow .12s,background .12s}
  .gen-link:hover{transform:translateY(-1px);background:#000;
    box-shadow:0 4px 0 rgba(29,26,22,.22),0 12px 20px -12px rgba(29,26,22,.6)}
  .gen-link:focus-visible{outline:2px solid var(--seal);outline-offset:2px}
  /* 「← 词库列表」同样只在通过本地服务访问时出现；纸底描边，别和主按钮抢眼 */
  .home-link{display:none;align-items:center;gap:6px;min-height:38px;padding:0 13px;
    border-radius:8px;background:var(--card);border:1px solid var(--line-2);
    color:var(--mid);text-decoration:none;font-size:13px;font-weight:600;
    transition:border-color .12s,color .12s}
  .home-link:hover{border-color:var(--muted);color:var(--ink)}
  .home-link:focus-visible{outline:2px solid var(--seal);outline-offset:2px}

  /* ---------- 视图切换 ---------- */
  .page{display:none;width:100%}
  .page.active{display:block;animation:fade .25s ease}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  /* ---------- 首页：统计（台账） ---------- */
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:16px 0}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:10px;
    padding:12px 10px;text-align:center;box-shadow:var(--shadow)}
  .stat b{display:block;font:700 19px/1.2 var(--mono);letter-spacing:-.02em;
    font-variant-numeric:tabular-nums}
  .stat span{color:var(--muted);font-size:11.5px;letter-spacing:.04em}

  /* 纸签：赭金左竖条 + 淡纸底，不再是亮黄告示 */
  .notice{background:#FBF3D9;border:1px solid #E4D28C;border-left:3px solid var(--ochre);
    color:#6B5410;border-radius:8px;padding:11px 14px;font-size:13.5px;margin:0 0 16px}
  .notice b{color:#543F08}

  /* ---------- 工具条 ---------- */
  .toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 14px}
  .search-wrap{position:relative;flex:1 1 220px}
  .search{width:100%;height:46px;border:1px solid var(--line-2);border-radius:8px;
    padding:0 42px 0 14px;font-size:15px;background:var(--paper-2);color:var(--ink);
    font-family:inherit}
  .search::placeholder{color:var(--muted)}
  .search:focus{outline:none;border-color:var(--muted);
    box-shadow:0 0 0 3px rgba(247,222,88,.55)}
  .toolbar-group{display:flex;gap:8px;flex:0 0 auto}

  /* ---------- 按钮 ---------- */
  .back-btn,.clear-btn,.dl-btn,.mode-btn,.nav-btn,.play-btn{
    font-family:inherit;font-size:15px;cursor:pointer;border:1px solid var(--line-2);
    background:var(--card);color:var(--ink);border-radius:8px;min-height:46px;
    padding:0 14px;transition:transform .12s,box-shadow .12s,background .12s,color .12s;
    display:inline-flex;align-items:center;justify-content:center;gap:6px;
  }
  .back-btn{font-size:18px;padding:0 16px}
  .clear-btn{position:absolute;right:4px;top:4px;min-height:38px;height:38px;
    border:none;background:transparent;color:var(--muted);padding:0 12px}
  /* 下载 / 播放 = 盖上去的墨块（硬投影，不是弥散阴影） */
  .dl-btn{background:var(--ink);color:var(--paper-2);border-color:var(--ink);
    font-weight:600;box-shadow:0 2px 0 rgba(29,26,22,.2)}
  .play-btn{background:var(--ink);color:var(--paper-2);border-color:var(--ink);
    font-weight:700;font-size:17px;min-height:56px;min-width:132px;padding:0 22px;
    box-shadow:0 3px 0 rgba(29,26,22,.22)}
  .play-btn:hover,.dl-btn:hover{background:#000;border-color:#000}
  .nav-btn{min-width:56px;font-size:18px;color:var(--mid)}
  .nav-btn:hover{color:var(--ink);background:rgba(29,26,22,.05)}
  /* 选中模式：荧光笔划过（浅黄底 + 印章红字），不是靛蓝块 */
  .mode-btn.active{background:var(--brand-soft);border-color:rgba(178,58,47,.28);
    color:var(--seal);font-weight:700}
  .back-btn:active,.clear-btn:active,.dl-btn:active,.mode-btn:active,
  .nav-btn:active,.play-btn:active{transform:scale(.97)}
  .play-btn:disabled,.dl-btn:disabled{opacity:.45;cursor:not-allowed}
  /* 模式按钮里的内联 SVG 图标（原先是 emoji） */
  .mi{width:15px;height:15px;flex:0 0 auto}

  /* ---------- 页卡片列表（书脊 + 纸片） ---------- */
  .list{display:flex;flex-direction:column;gap:10px}
  .card{position:relative;overflow:hidden;display:flex;align-items:center;gap:12px;
    background:var(--card);border:1px solid var(--line);border-radius:10px;
    padding:13px 15px 13px 20px;cursor:pointer;
    box-shadow:var(--shadow);transition:transform .12s,border-color .12s,box-shadow .12s}
  /* 书脊：4 色按渲染顺序轮转，纯装饰，不表达任何数据 */
  #list-body .card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;
    background:var(--seal);transition:width .16s}
  #list-body .card:nth-child(4n+2)::before{background:var(--prussian)}
  #list-body .card:nth-child(4n+3)::before{background:var(--moss)}
  #list-body .card:nth-child(4n+4)::before{background:var(--ochre)}
  .card:active{transform:scale(.995)}
  .card:hover{border-color:var(--line-2);box-shadow:var(--shadow-lg);
    transform:translateY(-1px)}
  .card:hover::before{width:9px}
  .card-main{flex:1 1 auto;min-width:0}
  .card-title{font-family:var(--kai);font-weight:700;font-size:17px;
    display:flex;align-items:center;gap:8px}
  .card-sub{color:var(--mid);font-size:13.5px;white-space:nowrap;overflow:hidden;
    text-overflow:ellipsis}
  .card-meta{flex:0 0 auto;color:var(--muted);font-size:13px;text-align:right;line-height:1.35;
    font-variant-numeric:tabular-nums}
  .card-meta b{color:var(--ink);font-size:15px;font-family:var(--mono);letter-spacing:-.02em}
  .dot{margin:0 4px}
  .badge-live{background:rgba(78,107,62,.14);color:var(--moss);font-size:11.5px;
    font-weight:700;padding:2px 7px;border-radius:999px}
  .empty{padding:40px 0;text-align:center;color:var(--muted)}
  .list-count{color:var(--muted);font-size:12.5px;margin:0 0 10px;font-family:var(--mono)}

  /* ---------- 播放页：一张「词条卡」 ---------- */
  .playhead{position:relative;background:var(--card);border:1px solid var(--line);
    border-radius:10px;padding:18px 18px 16px;box-shadow:var(--shadow);margin:16px 0 14px;
    overflow:hidden}
  .playhead::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;
    background:var(--seal)}
  .ph-index{color:var(--muted);font-size:12.5px;margin-bottom:7px;
    font-family:var(--mono);letter-spacing:-.01em}
  .ph-en{font-family:var(--kai);font-size:36px;font-weight:700;letter-spacing:.01em;
    line-height:1.2;word-break:break-word}
  .ph-cn{font-size:20px;color:var(--seal);margin-top:8px;font-weight:600}

  .progress-row{display:flex;align-items:center;gap:12px;margin:16px 0 4px}
  .progress{flex:1 1 auto;-webkit-appearance:none;appearance:none;height:8px;
    border-radius:999px;background:var(--line);outline:none}
  .progress::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;
    border-radius:50%;background:var(--ink);border:3px solid var(--paper-2);
    box-shadow:0 1px 4px rgba(29,26,22,.35);cursor:pointer}
  .progress::-moz-range-thumb{width:22px;height:22px;border-radius:50%;
    background:var(--ink);border:3px solid var(--paper-2);cursor:pointer}
  .clock{color:var(--muted);font-size:12.5px;font-variant-numeric:tabular-nums;
    flex:0 0 auto;min-width:82px;text-align:right;font-family:var(--mono)}

  .ctrl-group{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:14px 0}
  .mode-group{display:flex;gap:8px;flex-wrap:wrap}
  .section-label{color:var(--muted);font-size:11.5px;font-weight:700;letter-spacing:.12em;
    margin:18px 0 8px;text-transform:uppercase}

  /* ---------- 词条列表 ---------- */
  .rows{background:var(--card);border:1px solid var(--line);border-radius:10px;
    overflow:hidden;box-shadow:var(--shadow)}
  .row{display:grid;grid-template-columns:44px minmax(0,1.15fr) minmax(0,1fr);
    align-items:center;gap:10px;
    padding:12px 15px;border-bottom:1px solid var(--line);cursor:pointer;
    transition:background .12s}
  .row:last-child{border-bottom:none}
  .row:hover{background:rgba(29,26,22,.035)}
  .row .no{color:var(--muted);font-size:12.5px;font-variant-numeric:tabular-nums;
    font-family:var(--mono)}
  .row .en{font-weight:600;font-size:16.5px;word-break:break-word}
  .row .cn{color:var(--muted);font-size:14px;text-align:right;overflow-wrap:anywhere}
  /* 当前条 = 荧光笔划过这一行 */
  .row.current{background:var(--brand-soft)}
  .row.current .en{color:var(--seal)}
  .row.current .no{color:var(--seal);font-weight:700}

  .footer-note{color:var(--muted);font-size:12.5px;margin:18px 0 0;line-height:1.7}

  /* ---------- 底部迷你控制条：滚到列表任意位置都能直接暂停 ---------- */
  #page-play.active{padding-bottom:104px}   /* 给固定条让位，别遮住最后几条 */
  .minibar{
    position:fixed;left:0;right:0;bottom:0;z-index:60;display:none;
    align-items:center;gap:10px;
    padding:9px max(14px,calc(50vw - 396px)) calc(9px + env(safe-area-inset-bottom));
    background:rgba(246,242,231,.94);backdrop-filter:blur(10px);
    border-top:1px solid var(--line);box-shadow:0 -6px 20px -8px rgba(29,26,22,.3);
  }
  .minibar.show{display:flex}
  .minibar .mini-play{
    flex:0 0 auto;width:56px;height:46px;border-radius:8px;font-size:18px;
    border:1px solid var(--ink);background:var(--ink);color:var(--paper-2);cursor:pointer;
    box-shadow:0 2px 0 rgba(29,26,22,.2);
  }
  .minibar .mini-word{flex:1 1 auto;min-width:0}
  .minibar .mini-en{
    font-family:var(--kai);font-weight:700;font-size:17px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .minibar .mini-idx{color:var(--muted);font-size:11.5px;font-variant-numeric:tabular-nums;
    font-family:var(--mono)}
  .minibar .mini-nav{
    flex:0 0 auto;width:50px;height:46px;border-radius:8px;font-size:17px;
    border:1px solid var(--line-2);background:var(--card);color:var(--mid);cursor:pointer;
  }
  .minibar .mini-play:active,.minibar .mini-nav:active{transform:scale(.96)}

  /* ---------- 下载对话框（可改文件名；能弹「另存为」时可选位置） ---------- */
  .dlg{position:fixed;inset:0;z-index:80;display:none;align-items:center;justify-content:center;
    background:rgba(29,26,22,.46);padding:18px}
  .dlg.show{display:flex}
  .dlg-box{background:var(--card);border:1px solid var(--line);border-radius:10px;
    box-shadow:var(--shadow-lg);width:100%;max-width:460px;padding:18px}
  .dlg-title{font-family:var(--kai);font-weight:700;font-size:19px;margin:0 0 12px}
  .dlg-lab{display:block;color:var(--muted);font-size:12.5px;margin:0 0 6px}
  .dlg-input{width:100%;font:inherit;font-size:15px;padding:10px 12px;border-radius:8px;
    border:1px solid var(--line-2);background:var(--paper-2);color:var(--ink)}
  .dlg-input:focus{outline:none;border-color:var(--muted);
    box-shadow:0 0 0 3px rgba(247,222,88,.55)}
  .dlg-note{color:var(--muted);font-size:12.5px;line-height:1.7;margin:10px 0 0}
  .dlg-actions{display:flex;gap:10px;justify-content:flex-end;margin:16px 0 0}
  .dlg-actions button{font:inherit;font-size:15px;padding:10px 16px;border-radius:8px;
    cursor:pointer;border:1px solid var(--line-2);background:var(--card);color:var(--ink)}
  .dlg-actions .btn-primary{background:var(--ink);border-color:var(--ink);
    color:var(--paper-2);font-weight:700;box-shadow:0 3px 0 rgba(29,26,22,.22)}

  /* ---------- 调试状态条（按 d 键切换，排查"播放位置不对"用） ---------- */
  /* 等宽调试信息需要深底才读得清，故用暖墨而不是纸色 */
  .dbg{
    position:fixed;top:0;left:0;right:0;z-index:99;background:rgba(34,31,26,.94);
    color:#E9D9A6;font:11px/1.6 var(--mono);
    padding:3px 8px;white-space:nowrap;overflow:hidden;
  }
  .toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);
    background:var(--ink);color:var(--paper-2);font-size:14px;padding:11px 18px;
    border-radius:8px;box-shadow:0 10px 30px rgba(29,26,22,.3);
    opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:60;
    max-width:88vw;text-align:center}
  .toast.show{opacity:.96;transform:translate(-50%,0)}

  /* ---------- 窄屏：全部按钮 ≥44px（白名单必须覆盖所有 *-btn） ---------- */
  @media (max-width:900px){
    .back-btn,.clear-btn,.dl-btn,.mode-btn,.nav-btn,.play-btn{min-height:44px}
  }
  @media (max-width:560px){
    .stats{grid-template-columns:repeat(2,1fr)}
    .ph-en{font-size:30px}
    .row{grid-template-columns:36px minmax(0,1fr);grid-template-areas:"no en" ". cn"}
    .row .cn{grid-area:cn;text-align:left;margin-top:2px}
    .row .no{grid-area:no}
    .card-meta{font-size:12.5px}
    .play-btn{flex:1 1 100%}
    .card-title{font-size:16px}
  }

  /* ---------- 列表页底部提示（只剩移动端一句；PC 端不渲染任何内容） ---------- */
  .addbox-mobile{padding:14px 2px 0;text-align:center;color:var(--muted);font-size:13px}
  /* PC 端容器是空的 → 整块收起，别留一条空 margin */
  .addbox:empty{display:none}

  @media (prefers-reduced-motion:reduce){
    .page.active{animation:none}
    .card,.row,.minibar .mini-play,.minibar .mini-nav{transition:none}
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-in">
    <div class="brand"><span class="logo">▶</span>外语词汇听读播放器</div>
    <a class="home-link" id="home-link" href="/">← 词库列表</a>
    <a class="gen-link" id="gen-link" href="/generator">＋ 添加词表</a>
    <span class="tagline">纯 HTML 播放器 · <b id="ver" style="color:var(--muted)">—</b></span>
  </div>
</header>

<main class="wrap">

  <!-- ================= 视图 1：词库列表 ================= -->
  <section class="page active" id="page-list">
    <div class="stats">
      <div class="stat"><b id="s-pages">–</b><span>页</span></div>
      <div class="stat"><b id="s-words">–</b><span>词条</span></div>
      <div class="stat"><b id="s-sec">–</b><span>总时长</span></div>
      <div class="stat"><b id="s-size">–</b><span>音频体积</span></div>
    </div>

    <div class="notice">
      列表数据来自已生成的成品音频，<b>每页都可直接播放</b>，播放不需要联网。<span id="notice-extra"></span>
    </div>

    <div class="toolbar">
      <div class="search-wrap">
        <input class="search" id="q" type="search" placeholder="搜索页码或单词，例如 3 / curator"
               autocomplete="off">
        <button class="clear-btn" id="clear-q" title="清除搜索">✕</button>
      </div>
      <div class="toolbar-group">
        <button class="dl-btn" id="jump-first" disabled title="草图占位">全部下载</button>
      </div>
    </div>

    <div class="list-count" id="list-count"></div>
    <div class="list" id="list-body"></div>

    <!-- 移动端一句提示；PC 端由 renderAddbox() 留空，靠 .addbox:empty 收起 -->
    <section class="addbox" id="addbox" aria-label="添加词库说明"></section>
  </section>

  <!-- ================= 视图 2：播放器 ================= -->
  <section class="page" id="page-play">
    <div class="toolbar">
      <button class="back-btn" id="back" title="返回词库">←</button>
      <div class="card-main">
        <div class="card-title" id="play-title">第 2 页</div>
        <div class="card-sub" id="play-sub">18 词 · 1:10</div>
      </div>
      <div class="toolbar-group">
        <button class="dl-btn" id="dl" title="下载本页 MP3">↓ MP3</button>
      </div>
    </div>

    <div class="playhead">
      <div class="ph-index" id="ph-index">第 1 / 18 条</div>
      <div class="ph-en" id="ph-en">absent</div>
      <div class="ph-cn" id="ph-cn">缺席的</div>

      <div class="progress-row">
        <input class="progress" id="progress" type="range" min="0" max="70" step="0.1" value="0"
               aria-label="播放进度">
        <div class="clock" id="clock">0:00 / 1:10</div>
      </div>

      <div class="ctrl-group">
        <button class="play-btn" id="play">▶ 开始</button>

<script>
/* =========================================================================
   外语词汇听读播放器 · 界面草图
   播放内核：单 requestAnimationFrame 循环驱动时间轴。
   有真实音频的页 → 以 audio.currentTime 为准；其余页 → 虚拟时钟。
   （生产版按实施计划 §7 用 audio.onended + 代次计数器，本草图用单 tick 循环
     是为了让 110 页在只有 1 个真实音频文件时也能演示全部交互。）
   ========================================================================= */
const $ = s => document.querySelector(s);
const PAGES = DATA.pages;
const LIVE = DATA.audio;                    // {页号: {duration, mp3, tracks}} —— 接了真实音频的页
const EMBED = window.__EMBED__ || {};       // 离线单文件版注入：{页号: "data:audio/mpeg;base64,..."}
const BUILD = window.__BUILD__ || 'folder'; // 'folder' = index.html + audio/ 目录；'offline' = 单文件
/* 构建标识：显示在顶栏常驻位置。排查"你看的是哪一版"时让对方念这个即可，
   不再靠猜（本项目已因"不确定对方打开的是哪份文件"白跑过两轮）。 */
const VER = 'v2026-11-18.1';
const ALL_LIVE = PAGES.every(p => LIVE[p.page]);   // 是否每页都有真实音频（决定要不要逐行打徽标）
let curAudio = null;                        // 当前页的音频记录（无 → 用等分模拟时间轴）

/* 统计数字一律从数据实算，不写死 —— 离线演示版只含部分页时也不会说谎 */
function renderStats(){
  const words = PAGES.reduce((s, p) => s + p.words, 0);
  const sec = PAGES.reduce((s, p) => s + p.sec, 0);
  const by = PAGES.reduce((s, p) => s + p.bytes, 0);
  $('#s-pages').textContent = PAGES.length;
  $('#s-words').textContent = words;
  $('#s-sec').textContent = Math.round(sec / 60) + '′';
  $('#s-size').textContent = (by / 1048576).toFixed(1) + 'M';
  if (BUILD === 'offline'){
    $('#notice-extra').innerHTML = ' <b>离线单文件演示版：只内嵌了 '
      + Object.keys(EMBED).length + ' 页音频。</b>完整 ' + 110
      + ' 页请用「index.html + audio/ 目录」或通过局域网地址访问。';
  }
}
const SEQ_DEMO_PAGES = 3;                   // 全书顺序演示：最多跨 3 页

/* ---------------- 视图切换（单一入口，不硬编码 id 列表） ---------------- */
let curView = 'page-list';
function switchPage(id){
  if (curView === 'page-play' && id !== 'page-play') stopAll();
  document.querySelectorAll('.page').forEach(p => p.classList.toggle('active', p.id === id));
  curView = id;
  const mb = document.getElementById('minibar');
  if (mb) mb.classList.toggle('show', id === 'page-play');
  window.scrollTo(0, 0);
}

/* ---------------- 工具 ---------------- */
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtSec = v => { v = Math.max(0, Math.round(v)); return Math.floor(v/60) + ':' + String(v%60).padStart(2,'0'); };
let toastTimer = 0;
function toast(msg){
  const el = $('#toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2600);
}

/* ====================== 视图 1：词库列表 ====================== */
function renderList(){
  const kw = $('#q').value.trim().toLowerCase();
  const hit = PAGES.filter(p => !kw || String(p.page).includes(kw)
    || p.first.toLowerCase().includes(kw) || p.last.toLowerCase().includes(kw));
  $('#list-count').textContent = kw
    ? '匹配 ' + hit.length + ' 页（共 ' + PAGES.length + ' 页）'
    : '共 ' + PAGES.length + ' 页 · ' + (ALL_LIVE ? '每页都可播放' : Object.keys(LIVE).length + ' 页可播放');
  $('#list-body').innerHTML = hit.length ? hit.map(p => `
    <div class="card" role="button" tabindex="0" data-page="${p.page}">
      <div class="card-main">
        <div class="card-title">第 ${p.page} 页${(!ALL_LIVE && LIVE[p.page]) ? '<span class="badge-live">可试听</span>' : ''}</div>
        <div class="card-sub">${esc(p.first)} … ${esc(p.last)}</div>
      </div>
      <div class="card-meta"><b>${p.words}</b> 词<span class="dot">·</span>${fmtSec(p.sec)}</div>
    </div>`).join('') : '<div class="empty">没有匹配的页，换个关键词试试</div>';
}

$('#q').addEventListener('input', renderList);
$('#clear-q').addEventListener('click', () => { $('#q').value = ''; renderList(); $('#q').focus(); });
$('#jump-first').addEventListener('click', () => toast('草图中此按钮为占位（生产版：导出整包 / 逐页下载）'));

$('#list-body').addEventListener('click', e => {
  const card = e.target.closest('.card');
  if (card) openPage(Number(card.dataset.page));
});
$('#list-body').addEventListener('keydown', e => {
  if (e.key !== 'Enter' && e.key !== ' ') return;
  const card = e.target.closest('.card');
  if (card) { e.preventDefault(); openPage(Number(card.dataset.page)); }

/* ====================== 列表页底部提示 ======================
   现在只剩一件事：移动端给一句「请在 PC 端上传与生成」。
   PC 端新增词表 / 加页都走顶栏「＋ 添加词表」进生成器，包内不再贴任何命令
   （v1.3 起整块「添加词库 / 新增页」说明已移除）。

   约束（本项目 R6：文案宁可少承诺）：
   - 任何设备都不渲染 input[type=file] / 拖拽区 / "上传"按钮 —— 本包没有服务端，放控件就是假承诺；
   - PC 端容器保持为空，由 `.addbox:empty{display:none}` 收起，不留空条。
   ========================================================== */
function isMobileView(){
  try {
    const ua = navigator.userAgent || '';
    const mobileUA = /Android|iPhone|iPad|iPod|Mobile|HarmonyOS/i.test(ua);
    const touch = (navigator.maxTouchPoints || 0) > 1;
    const narrow = window.matchMedia('(max-width: 820px)').matches;
    const ipad = navigator.platform === 'MacIntel' && touch;   // iPadOS 13+ UA 伪装成 Mac
    return mobileUA || ipad || (touch && narrow);
  } catch (e) {
    return false;   // 探测失败按桌面态：PC 端本来就不渲染内容
  }
}

function renderAddbox(){
  const box = document.getElementById('addbox');
  if (!box) return;
  box.innerHTML = isMobileView()
    ? '<div class="addbox-mobile">请在 PC 端上传与生成</div>'
    : '';
}

/* ====================== 视图 2：播放器 ====================== */
let cur = null, tracks = [], idx = 0, mode = 'loopPage';
let playing = false, hasAudio = false, numPages = 1, pageCursor = 0;
let audio = null, simT = 0, rafId = 0, lastTs = 0, dragging = false;
let simStart = 0, advTimer = 0, wordDur = 1;

/* 词与词之间的停顿。逐词音频文件里**不再包含**尾部静音，停顿改由播放器负责。 */
const WORD_PAUSE_MS = 650;

/* 当前词条的独立音频文件。
   ⚠️ 这里有一个重要设计决定：**不再从整页 MP3 里按时间轴 seek 到某词。**
   原因（本项目为此连栽三轮）：
     ① 词边界只能靠"数静音"推断，而 GAP_EC 与 GAP_WORD 等长、无法区分，只能赌奇偶；
        片段内部停顿会多检出静音 → 奇偶翻转 → 之后所有边界都取到「英↔中」那一段，
        于是 start 指向该词中文起点（即上一个词的中文），表现为"先读了上一次的中文"。
     ② 多段 MP3 用 -c copy 直拼时，各 junction 会被 gapless 元数据裁掉一点
        （实测一页差 3.27s），"输入帧数之和 ≠ 输出帧数"，按帧累加也对不上。
     ③ 服务器不支持 HTTP Range 时整段音频不可 seek（见 serve.py 的说明）。
   改成「一词一个 MP3」后，播放某词 = 播那个文件，以上三个问题**全部不存在**。 */
const wordUrl = k => (tracks[k] && tracks[k].url) ? tracks[k].url : null;

function openPage(no, autoplay){
  cur = PAGES.find(p => p.page === no);
  if (!cur) return;
  pageCursor = 0;
  curAudio = LIVE[no] || null;
  if (curAudio && curAudio.tracks){
    tracks = curAudio.tracks.map(t => ({ i: t.i, en: t.en, cn: t.cn,
                                         url: t.url || null, start: t.start || 0 }));
  } else {
    tracks = (cur.pairs || []).map(([en, cn], i) => ({ i: i + 1, en, cn, url: null, start: 0 }));
  }
  hasAudio = tracks.some(t => t.url) || !!(curAudio && curAudio.mp3);
  if (!audio){
    audio = new Audio(); audio.preload = 'auto';
    /* 音频加载失败必须说话 —— 之前它是完全静默的，
       于是"点了没反应"既没有声音也没有任何提示，根本无从判断。 */
    audio.addEventListener('error', () => {
      const f = String(audio.currentSrc || audio.src || '').split('/').pop() || '音频文件';
      toast('音频加载失败：' + f + '（确认 audio/ 目录与 index.html 在一起）');
      setPlaying(false);
    });
    audio.addEventListener('ended', onEnded);       // 逐词音频：播完自动接下一词
  }
  if (audio){ audio.pause(); audio.removeAttribute('src'); audio.load(); }
  clearTimeout(advTimer);
  simT = 0; idx = 0; playing = false;
  cancelAnimationFrame(rafId);

  $('#play-title').textContent = '第 ' + cur.page + ' 页';
  $('#play-sub').textContent = cur.words + ' 词 · ' + fmtSec(cur.sec)
    + (hasAudio ? ' · 逐词音频' : ' · 模拟');
  $('#dl').disabled = !(curAudio && curAudio.mp3);
  $('#dl').title = (curAudio && curAudio.mp3) ? '下载本页 MP3' : '本页无整页音频';
  $('#kernel-note').innerHTML = hasAudio
    ? '每个词一个音频文件：<b>点任意一条即整条重播</b>，暂停后从当前词继续，「单条循环 / 本页循环 / 全书顺序」照常。'
    : '本页未接入音频，用<b>等分模拟</b>演示交互（真实时长 ' + fmtSec(cur.sec) + '）。';
  $('#progress').value = 0;

  renderRows();
  loadTrack(0);
  setPlaying(false);
  switchPage('page-play');
  if (autoplay) playFrom(0);
}

function renderRows(){
  $('#rows').innerHTML = tracks.map((t, k) => `
    <div class="row" data-k="${k}">
      <div class="no">${t.i}</div>
      <div class="en">${esc(t.en)}</div>
      <div class="cn">${esc(t.cn)}</div>
    </div>`).join('');
}

function showTrack(k){
  idx = k;
  const t = tracks[k];
  $('#ph-index').textContent = '第 ' + t.i + ' / ' + tracks.length + ' 条';
  $('#ph-en').textContent = t.en;
  $('#ph-cn').textContent = t.cn;
  $('#m-en').textContent = t.en;                                   // 底部条同步
  $('#m-idx').textContent = '第 ' + t.i + ' / ' + tracks.length + ' 条';
  document.querySelectorAll('.row').forEach((r, i) => r.classList.toggle('current', i === k));
  const row = document.querySelectorAll('.row')[k];
  if (row) row.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
}

function setPlaying(on){
  playing = on;
  $('#play').textContent = on ? '⏸ 暂停' : '▶ 开始';
  $('#play2').textContent = on ? '⏸' : '▶';       // 底部条同步
  if (on){
    lastTs = performance.now();
    simStart = performance.now();
    cancelAnimationFrame(rafId);
    rafId = requestAnimationFrame(tick);
  } else {
    cancelAnimationFrame(rafId);
  }
}

function setClock(t){
  $('#clock').textContent = fmtSec(t) + ' / ' + fmtSec(wordDur);
}

/* ---------------- 逐词播放核心（没有任何时间轴 seek） ----------------
   播放某词 = 把 audio.src 指到该词的音频文件；上一/下一词 = 换 src。
   每次播放都是一个**完整独立文件**，所以"从某词开始"永远精确，
   不会跨词串音（此前的实现正是栽在这一点上：从整页 MP3 按时间轴 seek，
   而时间轴只能靠数静音推断，奇偶一翻转就会先播到上一个词的中文）。

   历史上被这一改动一并消掉的问题：
     ① 静音不可区分导致的词边界错位（"先读了上一次的中文"）
     ② 多段 MP3 用 -c copy 直拼时 gapless 逐段裁切（输入帧数≠输出帧数）
     ③ 服务器不支持 HTTP Range 时整段音频不可 seek（见 vocab-tool/serve.py）
     ④ iOS 在元数据就绪前丢弃 currentTime 赋值 */


/* 选中第 k 条（只定位，不播放）。暂停时按上一词/下一词走这里。 */
function loadTrack(k){
  k = Math.max(0, Math.min(tracks.length - 1, k));
  clearTimeout(advTimer);
  const u = wordUrl(k);
  if (hasAudio && audio){
    if (u){
      if (audio.getAttribute('src') !== u){ audio.src = u; }
      else { try { audio.currentTime = 0; } catch (e) {} }
    } else if (curAudio && curAudio.mp3){
      /* 旧格式（整页一个音频、只有 start/end 没有逐词文件）：退回时间轴定位。
         只有打开当年那份 PDF 草图数据才会走到，新生成的词库包不会。 */
      const base = audio.getAttribute('src') || '';
      if (base.indexOf(curAudio.mp3) < 0) audio.src = curAudio.mp3;
      try { audio.currentTime = tracks[k].start || 0; } catch (e) {}
    }
  }
  simT = 0; simStart = performance.now();
  showTrack(k);
  syncProgress();
}

/* 从第 k 条开始播 */
function playFrom(k){
  loadTrack(k);
  if (hasAudio && audio){
    /* ⚠️ 不要做「先 play 再 pause」的所谓 iOS 解锁：那个 pause 是异步的，
       会把紧接着发出的真实 play() 一起掐掉（现象：第一次点开始没反应）。
       iOS 的解锁条件本就是「该元素曾在用户手势里成功 play()」——
       下面这句就在点击回调的同步栈里，它自己就完成了解锁。 */
    audio.play().catch(err => {
      if (err && err.name === 'NotAllowedError'){
        toast('浏览器拦了自动播放：请再点一次「开始」');
      }
    });
  }
  setPlaying(true);
}

/* 一条播完 → 按模式决定下一条 */
function onEnded(){
  if (!playing) return;
  if (mode === 'single'){ playFrom(idx); return; }                 // 单条循环
  if (mode === 'seqAll' && idx >= tracks.length - 1){              // 全书顺序：接下一页
    const nextNo = cur.page + 1;
    if (pageCursor >= SEQ_DEMO_PAGES || !PAGES.some(p => p.page === nextNo)){
      toast('全书顺序：本演示到第 ' + cur.page + ' 页为止');
      stopAll(); return;
    }
    pageCursor++; openPage(nextNo, true); return;
  }
  const nk = (idx >= tracks.length - 1) ? 0 : idx + 1;              // 本页循环
  /* 逐词音频里不含尾部静音，词间停顿在这里补 —— 也让家长有时间跟读。 */
  clearTimeout(advTimer);
  advTimer = setTimeout(() => { if (playing) playFrom(nk); }, WORD_PAUSE_MS);
}

/* 进度条与时钟：一律以「当前这一条」为尺度 */
function syncProgress(){
  const d = (hasAudio && audio && isFinite(audio.duration) && audio.duration > 0)
    ? audio.duration
    : (cur ? cur.sec / Math.max(1, tracks.length) : 1);
  wordDur = d;
  $('#progress').max = d;
  const t = (hasAudio && audio && isFinite(audio.currentTime)) ? audio.currentTime : simT;
  $('#progress').value = Math.min(t, d);
  setClock(t);
}

/* （原先的 applyPendingSeek / seekTo / trackAt / 旧 playFrom 已整体删除：
   改用逐词音频文件后，播放器不再需要任何时间轴 seek 逻辑。） */

function tick(ts){
  if (!playing) return;
  if (hasAudio && audio){
    const t = audio.currentTime;
    if (isFinite(t)){
      $('#progress').value = Math.min(t, wordDur);
      setClock(t);
    }
  } else {
    simT = (ts - simStart) / 1000;
    $('#progress').value = Math.min(simT, wordDur);
    setClock(simT);
    if (simT >= wordDur) onEnded();                 // 无音频时用计时器模拟推进
  }
  rafId = requestAnimationFrame(tick);
}

function stopAll(){
  playing = false;
  clearTimeout(advTimer);
  cancelAnimationFrame(rafId);
  if (audio){ audio.pause(); try { audio.currentTime = 0; } catch (e) {} }
  simT = 0;
  idx = 0;
  if (tracks.length) showTrack(0);
  syncProgress();
  setPlaying(false);
}

/* ---------------- 播放器交互 ---------------- */
$('#play').addEventListener('click', () => {
  if (playing){ setPlaying(false); if (hasAudio) audio.pause(); }
  else playFrom(idx);
});
/* 暂停时按上一词/下一词 = 只**定位**（换好音频文件、不播）；
   再点「开始」就从这个词的第一帧播起 —— 不会带出上一个词的中文。 */
$('#prev').addEventListener('click', () => {
  const k = Math.max(0, idx - 1);
  if (playing) playFrom(k); else loadTrack(k);
});
$('#next').addEventListener('click', () => {
  const k = Math.min(tracks.length - 1, idx + 1);
  if (playing) playFrom(k); else loadTrack(k);
});
$('#stop').addEventListener('click', () => { stopAll(); toast('已停止，回到第 1 条'); });
$('#back').addEventListener('click', () => switchPage('page-list'));
/* ---------------- 下载（文件名可改；能弹系统「另存为」时连位置一起选） ----------------
   浏览器限制说明：
     · `file://` 打开时，网页**不允许**自选保存文件夹（拿不到 showSaveFilePicker），
       只能走 <a download>，即存进浏览器默认下载目录 —— 但**文件名可以自己改**。
     · 通过 http://localhost 打开（Edge/Chrome）时可用 File System Access API，
       弹出系统「另存为」，**文件夹与文件名都能自选**。
   所以这里做成"先给一个可改的文件名，能弹另存为就弹，弹不出就如实告知并降级"。 */
const DL_NAME_KEY = 'pet_dl_filename';

function defaultDlName(){
  /* 词库包本身已按页命名（如「初中英语词汇表_第1页」），直接用包名即可，不必再拼页号 */
  const pack = (document.title || '').split('·')[0].trim() || '词库';
  return pack + '.mp3';
}
function canSaveAs(){
  try { return typeof window.showSaveFilePicker === 'function'; } catch (e) { return false; }
}

function openDl(){
  if (!(curAudio && curAudio.mp3)){ toast('本页没有整页 MP3 可下载'); return; }
  let remembered = '';
  try { remembered = localStorage.getItem(DL_NAME_KEY) || ''; } catch (e) {}
  $('#dl-name').value = remembered || defaultDlName();
  $('#dlg-title').textContent = '下载第 ' + cur.page + ' 页 MP3（' + tracks.length + ' 词）';
  /* ⚠️ 不能只用 `typeof showSaveFilePicker === 'function'` 判断：
     实测即使 `file://` 下这个函数也存在，但**调用时**才抛 SecurityError
     （file:// 是 opaque origin）。若照它写文案，就会错误地承诺"文件夹能自己选"。
     所以按协议如实说明；真正保存时再用 try/catch 决定实际走哪条路。 */
  const canPick = canSaveAs() && location.protocol !== 'file:';
  $('#dlg-note').innerHTML = canPick
    ? '点「保存」会弹出系统<b>另存为</b>：<b>文件夹和文件名都能自己选</b>。'
    : '当前以 <b>file://</b> 打开（双击 index.html），浏览器不允许网页自选保存文件夹，'
      + '文件会存到<b>浏览器的默认下载目录</b>，文件名用上面这个（可以改）。'
      + '<br>想能自选文件夹：用 Edge / Chrome 打开本页的 <b>http://localhost</b> 版本，'
      + '那时会弹出系统「另存为」，文件夹与文件名都能选。';
  $('#dlg').classList.add('show');
  setTimeout(() => { try { $('#dl-name').select(); } catch (e) {} }, 30);
}
function closeDl(){ $('#dlg').classList.remove('show'); }

async function doDownload(){
  const name = ($('#dl-name').value || '').trim() || defaultDlName();
  try { localStorage.setItem(DL_NAME_KEY, name); } catch (e) {}   // 记住上次用的名字
  const url = EMBED[cur.page] || curAudio.mp3;
  if (canSaveAs()){
    try {
      const h = await window.showSaveFilePicker({
        suggestedName: name,
        types: [{ description: 'MP3 音频', accept: { 'audio/mpeg': ['.mp3'] } }]
      });
      const w = await h.createWritable();
      const resp = await fetch(url);
      await w.write(await resp.blob());
      await w.close();
      closeDl(); toast('已保存：' + h.name);
      return;
    } catch (e) {
      if (e && e.name === 'AbortError') return;      // 用户取消 → 保持对话框
      /* 其它错误（如 file:// 下的 SecurityError）→ 走下面的降级 */
    }
  }
  const a = document.createElement('a');
  a.href = url;
  a.download = name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  closeDl();
  toast('已保存到浏览器默认下载目录：' + name);
}

$('#dl').addEventListener('click', openDl);
$('#dl-cancel').addEventListener('click', closeDl);
$('#dl-ok').addEventListener('click', doDownload);
$('#dlg').addEventListener('click', e => { if (e.target === $('#dlg')) closeDl(); });
$('#dl-name').addEventListener('keydown', e => {
  if (e.key === 'Enter'){ e.preventDefault(); doDownload(); }
  else if (e.key === 'Escape'){ e.preventDefault(); closeDl(); }
});

document.querySelectorAll('.mode-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    mode = btn.dataset.mode;
    if (mode === 'seqAll') pageCursor = 0;
    toast(mode === 'single' ? '单条循环：反复听这一条'
        : mode === 'loopPage' ? '本页循环：整页顺序播放并循环'
        : '全书顺序：本页播完自动接下一页（草图限 ' + SEQ_DEMO_PAGES + ' 页）');
  });
});

$('#progress').addEventListener('input', e => {
  dragging = true;
  const t = +e.target.value;                       // 进度条现在只表示「当前这一条」的进度
  if (hasAudio && audio){ try { audio.currentTime = t; } catch (err) {} } else simT = t;
  setClock(t);
});
$('#progress').addEventListener('change', () => { dragging = false; });

$('#rows').addEventListener('click', e => {
  const row = e.target.closest('.row');
  if (!row) return;
  // 提示写的是「点任意一条重听」→ 点了就该出声。
  // 旧逻辑只在 playing 时才播，暂停/停止状态下点词条只 seek 不出声，
  // 与提示不符，用户会以为"点了没反应"。
  playFrom(+row.dataset.k);
});

/* 底部迷你控制条：滚到列表任何位置都能直接暂停，不必回到顶部 */
$('#play2').addEventListener('click', () => $('#play').click());
$('#prev2').addEventListener('click', () => $('#prev').click());
$('#next2').addEventListener('click', () => $('#next').click());

/* 调试状态条：按 d 键切换；也可用 index.html?debug=1 直接打开
   （有些内置预览会截获键盘，给 URL 开关更可靠） */
let dbgEl = null;
function toggleDebug(){
  if (dbgEl){ dbgEl.remove(); dbgEl = null; return; }
  dbgEl = document.createElement('div');
  dbgEl.id = 'dbg';                 // ← 必须设 id：之前只设了 className，getElementById 永远取不到
  dbgEl.className = 'dbg';
  document.body.appendChild(dbgEl);
  (function loop(){
    if (!dbgEl) return;
    let ct = 'NaN', dur = 'NaN', rs = '-', err = 'none', srcn = '-';
    try {
      if (audio){
        ct = isFinite(audio.currentTime) ? audio.currentTime.toFixed(2) : 'NaN';
        dur = isFinite(audio.duration) ? audio.duration.toFixed(1) : 'NaN';
        rs = audio.readyState;
        err = audio.error ? ('code' + audio.error.code) : 'none';
        srcn = String(audio.currentSrc || audio.src || '').split('/').pop() || '-';
      }
    } catch (e) {}
    dbgEl.textContent = 'VER=' + VER + '  rs=' + rs + '  ct=' + ct + '  dur=' + dur
      + '  err=' + err + '  src=' + srcn
      + '  seeking=' + sk + '  pending=' + pd + '  idx=' + idx
      + '  playing=' + playing + '  mode=' + mode;
    requestAnimationFrame(loop);
  })();
}
document.addEventListener('keydown', e => {
  if (e.key === 'd' || e.key === 'D') toggleDebug();
});

document.addEventListener('keydown', e => {
  if (curView !== 'page-play') return;
  /* 下载对话框打开时不要抢键：否则在文件名输入框里打空格会触发播放/暂停 */
  if ($('#dlg').classList.contains('show')) return;
  const ae = document.activeElement;
  if (ae && (ae.tagName === 'INPUT' || ae.tagName === 'TEXTAREA')) return;
  if (e.key === ' '){ e.preventDefault(); $('#play').click(); }
  if (e.key === 'ArrowDown') $('#next').click();
  if (e.key === 'ArrowUp') $('#prev').click();
});

/* ---------------- 启动 ---------------- */
$('#ver').textContent = VER;                       // 顶栏常驻版本号，便于确认"看的是哪一版"
if (/[?&]debug=1/.test(location.search)) toggleDebug();
renderStats();
renderList();
renderAddbox();

/* ---------------- 生成器入口 ----------------
   只在本机服务下出现：真的请求一次 /api/packs（只读接口免 token），
   成功才显示按钮。file:// 下 fetch 必然失败 → 按钮不出现，
   不给一个「点了没反应」的假入口。 */
try {
  fetch('/api/packs', { method: 'GET' }).then(function (r) {
    if (!r.ok) return;
    ['#home-link', '#gen-link'].forEach(function (sel) {
      var a = $(sel); if (a) a.style.display = 'inline-flex';
    });
  }).catch(function () {});
} catch (e) {}
</script>
</body>
</html>
